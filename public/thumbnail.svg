<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a1b9a"/>
      <stop offset="100%" stop-color="#1e1e2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Three statement cards -->
  <g filter="url(#shadow)">
    <!-- Card A (truth) -->
    <rect x="35" y="35" width="76" height="100" rx="8" fill="#ffffff"/>
    <text x="73" y="75" font-family="sans-serif" font-size="28" font-weight="bold"
          fill="#2e7d32" text-anchor="middle">A</text>
    <text x="73" y="105" font-family="sans-serif" font-size="22"
          text-anchor="middle">✓</text>

    <!-- Card B (lie) -->
    <rect x="122" y="35" width="76" height="100" rx="8" fill="#ffebee"/>
    <text x="160" y="75" font-family="sans-serif" font-size="28" font-weight="bold"
          fill="#c62828" text-anchor="middle">B</text>
    <text x="160" y="105" font-family="sans-serif" font-size="22"
          text-anchor="middle">✗</text>

    <!-- Card C (truth) -->
    <rect x="209" y="35" width="76" height="100" rx="8" fill="#ffffff"/>
    <text x="247" y="75" font-family="sans-serif" font-size="28" font-weight="bold"
          fill="#2e7d32" text-anchor="middle">C</text>
    <text x="247" y="105" font-family="sans-serif" font-size="22"
          text-anchor="middle">✓</text>
  </g>

  <!-- Small "?" hint badge on the lie -->
  <circle cx="190" cy="45" r="12" fill="#c62828"/>
  <text x="190" y="51" font-family="sans-serif" font-size="16" font-weight="bold"
        fill="#fff" text-anchor="middle">?</text>

  <!-- Title strip -->
  <text x="160" y="163" font-family="sans-serif" font-size="16" font-weight="bold"
        fill="#ffffff" text-anchor="middle" opacity="0.9">Two Truths &amp; a Lie</text>
</svg>